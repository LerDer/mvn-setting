name: Build and Test Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        run: ./gradlew buildPlugin

      - name: Run plugin verification against IntelliJ Ultimate
        uses: ChrisCarini/intellij-platform-plugin-verifier-action@v1.2.4
        with:
          ide-versions: 'IU-2022.2.5' # IU = IntelliJ Ultimate, 可换成你需要的版本
          # 你也可以加上 IC-2022.2.5 以同时测试 Community 版
          # ide-versions: 'IC-2022.2.5,IU-2022.2.5'
plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '0.4.21'
}

group 'com.wd'
version '1.0.2'

sourceCompatibility = 1.8

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "https://plugins.gradle.org/m2/"
    }
}

dependencies {
    testCompile group: 'junit', name: 'junit', version: '4.12'
    
    annotationProcessor 'org.projectlombok:lombok:1.18.2'
    compileOnly 'org.projectlombok:lombok:1.18.2'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.2'
    testCompileOnly 'org.projectlombok:lombok:1.18.2'

    compile 'org.apache.commons:commons-lang3:3.10'
}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
    version '2019.1.4'
    intellij.updateSinceUntilBuild false
    localPath '/Users/lww/Downloads/ideaIC-2019.1.4'
}
patchPluginXml {
    changeNotes """
     version 1.0.2: <br>
     1. Add a button for opening the Maven settings of Idea
     2. Add a button to open the settings.xml folder
     3. Add a button for opening the conf folder of Maven
     4. Replace the word with icons
     
     <br>
     
     version 1.0.1: <br>
     1. Fix the size of the window <br/>
     2. Add scrollbar to file list <br/>
     3. The FileChooser will open the set folder after setting. <br/>
     4. Validate the file type which was chosen <br/>
     
     <br>
     version 1.0.0: <br>
     1. To manage the settings.xml file of Maven <br/>
      """
}